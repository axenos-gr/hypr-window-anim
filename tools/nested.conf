# Throwaway Hyprland config for testing hypr-window-anim in a nested window.
# SUPER binds only: the host owns ALT, and host binds win over the nested session.

monitor = , 1600x900@60, 0x0, 1

debug {
    disable_logs = false
}

general {
    layout = dwindle
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(9933ffee) rgba(ff9966ee) 45deg
}

decoration {
    rounding = 10
    shadow {
        enabled = true
        range = 6
    }
}

animations {
    enabled = yes
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeOut, 1, 1.46, default
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    background_color = rgb(1e1e2e)
}

input {
    kb_layout = us
}

exec-once = foot

# several ways to get a terminal; inside it any app can be started too
bind = SUPER, Return, exec, foot
bind = SUPER, KP_Enter, exec, foot
bind = SUPER, T, exec, foot
bind = SUPER, Q, exec, foot
bind = SUPER, C, killactive
bind = SUPER SHIFT, E, exit
bind = SUPER, V, togglefloating
bind = SUPER, P, exec, hyprctl hwanim preview
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
